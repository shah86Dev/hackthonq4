openapi: 3.0.0
info:
  title: Book-Embedded RAG Chatbot API
  description: API for interacting with the Book-Embedded RAG Chatbot system
  version: 1.0.0
servers:
  - url: http://localhost:8000
    description: Local development server
  - url: https://api.book-rag-chatbot.com
    description: Production server
paths:
  /chat:
    post:
      summary: Submit a question about book content
      description: Submit a question about the book content with optional selected text context
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChatRequest'
      responses:
        '200':
          description: Successful response with answer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatResponse'
        '400':
          description: Invalid request parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: Rate limit exceeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /ingest:
    post:
      summary: Ingest a book for processing
      description: Upload book content to be processed, chunked, and embedded
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IngestRequest'
      responses:
        '200':
          description: Book successfully ingested and processing started
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IngestResponse'
        '400':
          description: Invalid request parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '413':
          description: Book content too large
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /health:
    get:
      summary: Health check endpoint
      description: Check the health status of the API
      responses:
        '200':
          description: API is healthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
components:
  schemas:
    ChatRequest:
      type: object
      required:
        - question
      properties:
        question:
          type: string
          description: The question to ask about the book content
          example: "What are the main themes of this book?"
        selected_text:
          type: string
          description: Optional text selected by the user in the book viewer
          example: "The main themes of this book include love, loss, and redemption."
    ChatResponse:
      type: object
      required:
        - answer
      properties:
        answer:
          type: string
          description: The answer generated by the system based on book content
          example: "The main themes of this book are love, loss, and redemption, as evidenced by..."
        citations:
          type: array
          items:
            type: string
          description: List of chunk IDs that provided context for the answer
          example: ["chunk-123", "chunk-456", "chunk-789"]
        confidence:
          type: number
          format: float
          minimum: 0
          maximum: 1
          description: Confidence score for the answer's grounding in source material
          example: 0.95
    IngestRequest:
      type: object
      required:
        - title
        - content
        - format
      properties:
        title:
          type: string
          description: Title of the book
          example: "Foundation"
        author:
          type: string
          description: Author of the book
          example: "Isaac Asimov"
        content:
          type: string
          description: The full text content of the book
          example: "The Seldon Crisis was the time during which the science of psychohistory was first put to the test..."
        format:
          type: string
          enum: [PDF, MD, TXT]
          description: Format of the book content
          example: "TXT"
        chunk_size:
          type: integer
          minimum: 500
          maximum: 1000
          default: 1000
          description: Size of text chunks in characters
        chunk_overlap:
          type: integer
          minimum: 0
          maximum: 500
          default: 200
          description: Overlap between chunks in characters
    IngestResponse:
      type: object
      required:
        - book_id
        - status
        - total_chunks
        - processing_time_ms
      properties:
        book_id:
          type: string
          description: Unique identifier for the processed book
          example: "book-456"
        status:
          type: string
          enum: [pending, processing, completed, failed]
          description: Current processing status
          example: "processing"
        total_chunks:
          type: integer
          description: Number of chunks created from the book
          example: 1250
        processing_time_ms:
          type: integer
          description: Time taken to process the book in milliseconds
          example: 12500
    HealthResponse:
      type: object
      required:
        - status
        - timestamp
      properties:
        status:
          type: string
          enum: [healthy, degraded, unavailable]
          description: Health status of the API
          example: "healthy"
        timestamp:
          type: string
          format: date-time
          description: Timestamp of the health check
          example: "2025-12-25T10:00:00Z"
        details:
          type: object
          description: Additional health details
          example: {"qdrant_connected": true, "postgres_connected": true}
    ErrorResponse:
      type: object
      required:
        - error
        - message
      properties:
        error:
          type: string
          description: Error code
          example: "VALIDATION_ERROR"
        message:
          type: string
          description: Human-readable error message
          example: "The request body is missing required fields"
        details:
          type: object
          description: Additional error details
          example: {"field": "question", "reason": "This field is required"}