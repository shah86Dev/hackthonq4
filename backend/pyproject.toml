[project]
name = "book-embedded-rag-chatbot-backend"
version = "1.0.0"
description = "Backend API for Book-Embedded RAG Chatbot"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.104.1",
    "uvicorn[standard]>=0.24.0",
    "openai>=1.3.5",
    "qdrant-client>=1.8.0",
    "psycopg2-binary>=2.9.9",
    "langchain>=0.1.16",
    "pydantic>=2.5.0",
    "python-dotenv>=1.0.0",
    "tiktoken>=0.5.2",
    "pypdf>=3.17.1",
    "markdown>=3.5.1",
    "ray[default]>=2.9.0",
    "dapr>=1.12.0",
    "dapr-ext-fastapi>=1.12.0",
    "pytest>=7.4.3",
    "pytest-asyncio>=0.21.1",
    "sqlalchemy>=2.0.23",
    "alembic>=1.13.1",
]

[tool.black]
line-length = 88
target-version = ['py311']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.venv
  | venv
  | env
  | \.env
  | node_modules
  | dist
  | build
  | \.egg-info
)/
'''

[tool.isort]
profile = "black"
multi_line_output = 3
known_first_party = ["src"]
known_third_party = ["fastapi", "uvicorn", "openai", "qdrant_client", "sqlalchemy", "pydantic", "pydantic_settings", "pytest", "httpx", "tiktoken", "uuid7"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"