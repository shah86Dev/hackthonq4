apiVersion: v1
kind: Service
metadata:
  name: book-rag-backend-service
  namespace: default
  labels:
    app: book-rag-backend
spec:
  selector:
    app: book-rag-backend
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8000
  type: ClusterIP
---
apiVersion: v1
kind: Service
metadata:
  name: book-rag-frontend-service
  namespace: default
  labels:
    app: book-rag-frontend
spec:
  selector:
    app: book-rag-frontend
  ports:
    - protocol: TCP
      port: 80
      targetPort: 3000
  type: LoadBalancer